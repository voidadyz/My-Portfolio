<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adhil Rahman | Digital Marketing Strategist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Orbitron:wght@800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="header">
    <a href="#home" class="logo">
      <!-- Put your logo at images/logo.png -->
      <img src="images/logo.png" alt="Logo" />
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Menu">
      <i class="fa-solid fa-bars"></i>
    </button>

    <nav class="nav" id="nav">
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#certificate">Certificate</a>
      <a href="#services">Services</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#posts" class="posts-link">Posts<span class="badge">Trending</span></a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <!-- ============ HERO / HOME ============ -->
  <section class="hero" id="home">
    <div class="hero-content">
      <h1 class="hero-name">Adhil Rahman</h1>
      <p class="hero-sub">Digital Marketer & Graphic Designert | Kerala | India</p>

      <div class="hero-buttons">
        <!-- CHANGE: Enquiry link (e.g. "#contact" or "mailto:you@email.com") -->
        <a href="#contact" class="btn btn-primary">Enquiry <i class="fa-solid fa-arrow-right"></i></a>
        <a href="#services" class="btn btn-outline">Services</a>
      </div>
    </div>

    <div class="hero-image">
      <!-- Put your photo at images/hero.png -->
      <img src="images/hero.png" alt="Dilshad Mirsha" />
    </div>
  </section>

  <!-- ============ SIDE SOCIAL PANEL ============ -->
  <aside class="side-social" id="sideSocial">
    <button class="side-toggle" id="sideToggle" aria-label="Toggle social links">
      <i class="fa-solid fa-arrow-right-long"></i>
    </button>

    <!-- CHANGE: your LinkedIn URL -->
    <a href="https://www.linkedin.com/in/muhammad-adhil-b231b439a/" class="side-icon linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
      <i class="fa-brands fa-linkedin-in"></i>
    </a>

    <!-- CHANGE: your Instagram URL -->
    <a href="https://www.instagram.com/_adhil_rahman" class="side-icon instagram" target="_blank" rel="noopener" aria-label="Instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>
  </aside>

  <!-- ============ WHATSAPP FLOAT ============ -->
  <!-- CHANGE: replace 919999999999 with your number (country code first, no + or spaces) -->
  <a href="https://wa.me/7025720589?text=Hello%2C%20I%20would%20like%20to%20enquire" class="whatsapp-float" target="_blank" rel="noopener" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script>
    // Mobile menu
    const menuToggle = document.getElementById("menuToggle");
    const nav = document.getElementById("nav");
    menuToggle.addEventListener("click", () => nav.classList.toggle("open"));
    nav.querySelectorAll("a").forEach(a =>
      a.addEventListener("click", () => nav.classList.remove("open"))
    );

    // Side social panel open/close
    const sideSocial = document.getElementById("sideSocial");
    document.getElementById("sideToggle").addEventListener("click", () => {
      sideSocial.classList.toggle("closed");
    });
  </script>
</body>
</html>
